<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>The Best Brand — Studio</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #0D2540; color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Montserrat", "Plus Jakarta Sans", sans-serif;
      display: flex; align-items: center; justify-content: center; text-align: center;
    }
    .loader-card { max-width: 360px; padding: 32px 24px; }
    .logo { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 16px 40px rgba(0,0,0,0.45); margin-bottom: 18px; }
    h1 { font-size: 1.25rem; font-weight: 900; margin: 0 0 8px; letter-spacing: 0.02em; }
    p { font-size: 0.88rem; color: #CBD5E1; line-height: 1.5; margin: 0 0 20px; }
    .btn {
      display: inline-block; background: linear-gradient(135deg, #FF7A00, #E05E00);
      color: #FFFFFF; text-decoration: none; font-weight: 800; font-size: 0.9rem;
      padding: 13px 24px; border-radius: 999px; border: none; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="loader-card">
    <img src="assets/logos/Isotipo_Oficial_TheBestBrand_LiquidGlass_1024px.png" alt="The Best Brand" class="logo" />
    <h1>THE BEST BRAND</h1>
    <p>Conectando con el Atelier de Identidad Visual Algorítmica y Voz IA (Aura)...</p>
    <a class="btn" href="https://thebestbrand.app/studio">Entrar al Estudio →</a>
  </div>
  <script>
    setTimeout(function () {
      if (navigator.onLine !== false) {
        window.location.replace("https://thebestbrand.app/studio");
      }
    }, 350);
  </script>
</body>
</html>
