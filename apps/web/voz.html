<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Aura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ib-navy: #0D2540;
      --ib-blue: #426EAE;
      --ib-orange: #FF7A00;
      --ib-sky: #4C9DE6;
      --ib-charcoal: #333333;
      --ib-gray: #707070;
      --ib-line: #E6E6E6;
      --ib-white: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ib-white);
      color: var(--ib-navy);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .cockpit {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 560px;
      margin: 0 auto;
      background: var(--ib-white);
      position: relative;
    }
    .orb-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(env(safe-area-inset-top, 6px) + 6px) 16px 6px;
      border-bottom: 1px solid var(--ib-line);
      background: var(--ib-white);
      flex-shrink: 0;
    }
    .orb-canvas-btn {
      position: relative;
      width: clamp(72px, 11.5dvh, 108px);
      height: clamp(72px, 11.5dvh, 108px);
      border-radius: 50%;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #auraOrbCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: block;
    }
    .chat-stream {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #F8FAFD;
    }
    .msg-row {
      display: flex;
      width: 100%;
    }
    .msg-row.user {
      justify-content: flex-end;
    }
    .msg-row.aura {
      justify-content: flex-start;
    }
    .bubble {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.42;
      word-break: break-word;
    }
    .msg-row.user .bubble {
      background: var(--ib-navy);
      color: var(--ib-white);
      border-bottom-right-radius: 4px;
    }
    .msg-row.aura .bubble {
      background: var(--ib-white);
      color: var(--ib-navy);
      border: 1px solid var(--ib-line);
      border-left: 3.5px solid var(--ib-orange);
      border-bottom-left-radius: 4px;
    }
    .bubble-attachment {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 8px;
      background: rgba(255, 122, 0, 0.14);
      color: var(--ib-orange);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .msg-row.user .bubble-attachment {
      background: rgba(255, 255, 255, 0.15);
      color: #FFD2A6;
    }
    .attachment-tray {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 14px;
      background: var(--ib-white);
      border-top: 1px solid var(--ib-line);
    }
    .attachment-tray.has-items {
      display: flex;
    }
    .att-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #F2F6FC;
      border: 1px solid var(--ib-line);
      font-size: 12px;
      font-weight: 600;
      color: var(--ib-navy);
    }
    .att-chip button {
      border: none;
      background: transparent;
      color: var(--ib-orange);
      font-weight: 800;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
    }
    .plus-sheet {
      display: none;
      position: absolute;
      left: 14px;
      bottom: calc(env(safe-area-inset-bottom, 12px) + 64px);
      background: var(--ib-white);
      border: 1px solid var(--ib-line);
      border-radius: 16px;
      padding: 8px;
      box-shadow: 0 12px 32px rgba(13, 37, 64, 0.14);
      z-index: 20;
      min-width: 210px;
    }
    .plus-sheet.open {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .plus-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: none;
      background: transparent;
      border-radius: 10px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ib-navy);
      cursor: pointer;
      text-align: left;
    }
    .plus-option:hover, .plus-option:active {
      background: #F4F8FD;
    }
    .plus-icon-circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #EEF4FC;
      color: var(--ib-blue);
    }
    .plus-icon-circle.orange {
      background: #FFF3E8;
      color: var(--ib-orange);
    }
    .input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px calc(env(safe-area-inset-bottom, 12px) + 8px);
      background: var(--ib-white);
      border-top: 1px solid var(--ib-line);
      flex-shrink: 0;
    }
    .plus-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1.5px solid var(--ib-line);
      background: #F4F8FD;
      color: var(--ib-blue);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .plus-btn.active {
      background: var(--ib-navy);
      color: var(--ib-white);
      border-color: var(--ib-navy);
      transform: rotate(45deg);
    }
    .input-field {
      flex: 1;
      height: 40px;
      border: 1.5px solid var(--ib-line);
      border-radius: 20px;
      padding: 0 14px;
      font-size: 14.5px;
      color: var(--ib-navy);
      background: #F9FBFE;
      outline: none;
    }
    .input-field:focus {
      border-color: var(--ib-blue);
      background: var(--ib-white);
    }
    .action-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--ib-blue);
      color: var(--ib-white);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .action-btn.listening, .action-btn.send-mode {
      background: var(--ib-orange);
    }
  </style>
</head>
<body>
  <div class="cockpit">
    <header class="orb-header">
      <button type="button" class="orb-canvas-btn" id="micBtn" aria-label="Aura">
        <canvas id="auraOrbCanvas" width="304" height="304"></canvas>
      </button>
    </header>

    <main class="chat-stream" id="chatStream">
      <div class="msg-row aura">
        <div class="bubble" id="replyText">Hola Jorge. ¿En qué te ayudo hoy?</div>
      </div>
    </main>

    <div class="attachment-tray" id="attachmentTray"></div>

    <div class="plus-sheet" id="plusSheet">
      <button type="button" class="plus-option" id="optCamera">
        <span class="plus-icon-circle orange">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        </span>
        <span>Cámara</span>
      </button>
      <button type="button" class="plus-option" id="optPhotos">
        <span class="plus-icon-circle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </span>
        <span>Fotos y Galería</span>
      </button>
      <button type="button" class="plus-option" id="optDocs">
        <span class="plus-icon-circle orange">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        </span>
        <span>Documento (PDF, Excel, CSV)</span>
      </button>
    </div>

    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" />
    <input type="file" id="photoInput" accept="image/*" multiple style="display:none" />
    <input type="file" id="docInput" accept=".pdf,.xlsx,.xls,.docx,.doc,.csv,.txt,image/*,audio/*" multiple style="display:none" />

    <form class="input-bar" id="cmdForm">
      <button type="button" class="plus-btn" id="plusBtn" aria-label="Adjuntar archivo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <input type="text" class="input-field" id="cmdInput" placeholder="Mensaje" autocomplete="off" />
      <button type="submit" class="action-btn" id="actionBtn" aria-label="Enviar o hablar">
        <svg id="iconMic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" x2="12" y1="19" y2="22"/>
        </svg>
        <svg id="iconSend" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const autoStart = params.get('autostart') === '1';
      const micBtn = document.getElementById('micBtn');
      const chatStream = document.getElementById('chatStream');
      const cmdForm = document.getElementById('cmdForm');
      const cmdInput = document.getElementById('cmdInput');
      const actionBtn = document.getElementById('actionBtn');
      const iconMic = document.getElementById('iconMic');
      const iconSend = document.getElementById('iconSend');
      const plusBtn = document.getElementById('plusBtn');
      const plusSheet = document.getElementById('plusSheet');
      const attachmentTray = document.getElementById('attachmentTray');
      const cameraInput = document.getElementById('cameraInput');
      const photoInput = document.getElementById('photoInput');
      const docInput = document.getElementById('docInput');

      let currentState = 'idle'; // idle | listening | thinking | speaking
      let pendingAttachments = [];

      // =========================================================================
      // IDENTIDAD CANÓNICA FIJA: Personalizado ImproBears · 01 · Torus Cuántico 3D
      // Colores Hex Exactos: Primario #1D4ED8 (29,78,216), Secundario #E04700 (224,71,0), Acento #EA7300 (234,115,0)
      // =========================================================================
      const canvas = document.getElementById('auraOrbCanvas');
      const ctx = canvas.getContext('2d');
      let auraAngle = 0;

      function renderTheBestBrandOrb() {
        const isSpeakingLive = currentState === 'listening' || currentState === 'speaking';
        auraAngle += 0.016 * (isSpeakingLive ? 2.2 : 1.0);

        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const maxR = Math.min(cx, cy) - 4;
        const scaleRatio = maxR / 106;

        ctx.clearRect(0, 0, w, h);
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, maxR, 0, Math.PI * 2);
        ctx.clip();

        const r1 = 29, g1 = 78, b1 = 216;   // #1D4ED8
        const r2 = 224, g2 = 71, b2 = 0;    // #E04700
        const r3 = 234, g3 = 115, b3 = 0;   // #EA7300

        // 1. Base de la Esfera Obsidiana Profunda (3D)
        const sphereBase = ctx.createRadialGradient(cx, cy * 0.82, maxR * 0.05, cx, cy, maxR);
        sphereBase.addColorStop(0, 'rgba(' + r1 + ', ' + g1 + ', ' + b1 + ', 0.36)');
        sphereBase.addColorStop(0.55, '#0B101E');
        sphereBase.addColorStop(1, '#04060B');
        ctx.fillStyle = sphereBase;
        ctx.fillRect(0, 0, w, h);

        ctx.globalCompositeOperation = 'screen';

        // 2. 4 Lóbulos Volumétricos
        const pulseAmpLight = isSpeakingLive ? 1.25 + Math.sin(auraAngle * 4.2) * 0.15 : 1.0;
        const lobeColors = [
          [r1, g1, b1, 0.72],
          [r2, g2, b2, 0.78],
          [r3, g3, b3, 0.64],
          [r1, g1, b1, 0.68]
        ];
        for (let i = 0; i < 4; i++) {
          const ang = auraAngle * (i % 2 === 0 ? 1.1 : -0.9) + i * 1.57;
          const lx = cx + Math.cos(ang) * maxR * 0.28 * pulseAmpLight;
          const ly = cy + Math.sin(ang * 1.2) * maxR * 0.28 * pulseAmpLight;
          const lr = maxR * 0.62 * (isSpeakingLive ? 1.15 : 1.0);
          const lg = ctx.createRadialGradient(lx, ly, lr * 0.05, lx, ly, lr);
          const c = lobeColors[i];
          lg.addColorStop(0, 'rgba(' + c[0] + ', ' + c[1] + ', ' + c[2] + ', ' + c[3] + ')');
          lg.addColorStop(1, 'rgba(' + c[0] + ', ' + c[1] + ', ' + c[2] + ', 0)');
          ctx.fillStyle = lg;
          ctx.beginPath();
          ctx.arc(lx, ly, lr, 0, Math.PI * 2);
          ctx.fill();
        }

        // 3. Geometría 01 · Torus Cuántico 3D (12 anillos paramétricos)
        const rings = 12;
        for (let i = 0; i < rings; i++) {
          const u = (i / rings) * Math.PI * 2 + auraAngle * 0.5;
          ctx.beginPath();
          for (let j = 0; j <= 24; j++) {
            const v = (j / 24) * Math.PI * 2;
            const R = maxR * 0.52;
            const rt = maxR * 0.22;
            const sx = cx + (R + rt * Math.cos(v)) * Math.cos(u);
            const sy = cy + (R + rt * Math.cos(v)) * Math.sin(u) * 0.74 + rt * Math.sin(v) * 0.48;
            if (j === 0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
          }
          ctx.strokeStyle = i % 2 === 0
            ? 'rgba(' + r1 + ', ' + g1 + ', ' + b1 + ', 0.68)'
            : 'rgba(' + r3 + ', ' + g3 + ', ' + b3 + ', 0.58)';
          ctx.lineWidth = Math.max(1.1, 1.8 * scaleRatio);
          ctx.stroke();
        }

        // 4. Núcleo Luminoso Central
        ctx.globalCompositeOperation = 'source-over';
        const coreLightR = (isSpeakingLive ? 34 : 26) * scaleRatio;
        const coreLightGrad = ctx.createRadialGradient(cx, cy, 1, cx, cy, coreLightR);
        coreLightGrad.addColorStop(0, 'rgba(255, 255, 255, 0.98)');
        coreLightGrad.addColorStop(0.5, 'rgba(' + r2 + ', ' + g2 + ', ' + b2 + ', 0.62)');
        coreLightGrad.addColorStop(1, 'rgba(' + r1 + ', ' + g1 + ', ' + b1 + ', 0)');
        ctx.fillStyle = coreLightGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, coreLightR, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // 5. Aro Exterior Oficial #1D4ED8
        ctx.beginPath();
        ctx.arc(cx, cy, maxR, 0, Math.PI * 2);
        ctx.strokeStyle = '#1D4ED8';
        ctx.lineWidth = 3.2;
        ctx.stroke();

        requestAnimationFrame(renderTheBestBrandOrb);
      }
      renderTheBestBrandOrb();

      function syncActionIcon() {
        const hasTextOrFiles = cmdInput.value.trim().length > 0 || pendingAttachments.length > 0;
        if (hasTextOrFiles) {
          iconMic.style.display = 'none';
          iconSend.style.display = 'block';
          actionBtn.classList.add('send-mode');
        } else {
          iconMic.style.display = 'block';
          iconSend.style.display = 'none';
          actionBtn.classList.remove('send-mode');
        }
      }

      cmdInput.addEventListener('input', syncActionIcon);

      function renderAttachmentTray() {
        attachmentTray.innerHTML = '';
        if (pendingAttachments.length === 0) {
          attachmentTray.classList.remove('has-items');
          syncActionIcon();
          return;
        }
        attachmentTray.classList.add('has-items');
        pendingAttachments.forEach(function (item, idx) {
          const chip = document.createElement('span');
          chip.className = 'att-chip';
          chip.textContent = item.name + ' ';
          const rm = document.createElement('button');
          rm.type = 'button';
          rm.textContent = '×';
          rm.addEventListener('click', function () {
            pendingAttachments.splice(idx, 1);
            renderAttachmentTray();
          });
          chip.appendChild(rm);
          attachmentTray.appendChild(chip);
        });
        syncActionIcon();
      }

      function handleFilesSelected(fileList) {
        if (!fileList || !fileList.length) return;
        for (let i = 0; i < fileList.length; i++) {
          pendingAttachments.push({
            name: fileList[i].name,
            type: fileList[i].type || 'application/octet-stream',
            size: fileList[i].size || 0
          });
        }
        plusSheet.classList.remove('open');
        plusBtn.classList.remove('active');
        renderAttachmentTray();
      }

      plusBtn.addEventListener('click', function () {
        plusSheet.classList.toggle('open');
        plusBtn.classList.toggle('active');
      });

      document.getElementById('optCamera').addEventListener('click', function () { cameraInput.click(); });
      document.getElementById('optPhotos').addEventListener('click', function () { photoInput.click(); });
      document.getElementById('optDocs').addEventListener('click', function () { docInput.click(); });

      cameraInput.addEventListener('change', function (e) { handleFilesSelected(e.target.files); e.target.value = ''; });
      photoInput.addEventListener('change', function (e) { handleFilesSelected(e.target.files); e.target.value = ''; });
      docInput.addEventListener('change', function (e) { handleFilesSelected(e.target.files); e.target.value = ''; });

      function appendBubble(role, text, attachments) {
        const row = document.createElement('div');
        row.className = 'msg-row ' + role;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        if (attachments && attachments.length > 0) {
          attachments.forEach(function (att) {
            const tag = document.createElement('div');
            tag.className = 'bubble-attachment';
            tag.textContent = att.name;
            bubble.appendChild(tag);
          });
        }

        const p = document.createElement('div');
        p.textContent = text;
        bubble.appendChild(p);
        row.appendChild(bubble);
        chatStream.appendChild(row);
        chatStream.scrollTop = chatStream.scrollHeight;
        return p;
      }

      function speakText(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'es-MX';
        u.rate = 1.02;
        u.onstart = function () { currentState = 'speaking'; };
        u.onend = function () { currentState = 'idle'; };
        window.speechSynthesis.speak(u);
      }

      async function sendCommand(text) {
        const clean = String(text || '').trim();
        const filesToSend = pendingAttachments.slice();
        if (!clean && filesToSend.length === 0) return;

        const displayMsg = clean || ('Archivo adjunto (' + filesToSend.map(function (f) { return f.name; }).join(', ') + ')');
        appendBubble('user', displayMsg, filesToSend);

        pendingAttachments = [];
        renderAttachmentTray();
        currentState = 'thinking';

        const promptWithAttachments = filesToSend.length > 0
          ? displayMsg + ' [Adjuntos: ' + filesToSend.map(function (f) { return f.name; }).join(', ') + ']'
          : displayMsg;

        const endpoints = [
          'https://thebestbrand-api-studio-production.up.railway.app/api/aura/action-button',
          '/api/aura/action-button',
          'http://34.121.182.185:4747/api/gina/action-button'
        ];

        for (let i = 0; i < endpoints.length; i++) {
          try {
            const res = await fetch(endpoints[i], {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                text: promptWithAttachments,
                query: promptWithAttachments,
                attachments: filesToSend,
                send_whatsapp: true,
                include_audio: false,
                project: 'Aura ImproBears'
              })
            });
            if (res.ok) {
              const data = await res.json();
              const answer = data.voice_reply || data.full_reply || data.reply || data.response || data.message;
              const lowAns = String(answer || '').toLowerCase();
              if (
                answer &&
                !String(answer).includes('113,680') &&
                !lowAns.includes('cobranza de ingready') &&
                !lowAns.includes('foco principal sigue en la cobranza')
              ) {
                appendBubble('aura', answer);
                speakText(answer);
                return;
              }
            }
          } catch (_) {}
        }

        const diag = 'Jorge, no pude conectar en este instante con el servidor Cloud 24/7 (thebestbrand-api-studio-production.up.railway.app). No inventaré ningún dato hasta confirmar conexión con el sistema.';
        appendBubble('aura', diag);
        speakText(diag);
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      let recognition = null;
      let isListening = false;

      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'es-MX';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = function () {
          isListening = true;
          currentState = 'listening';
          actionBtn.classList.add('listening');
        };
        recognition.onresult = function (event) {
          const transcript = event.results[0][0].transcript;
          sendCommand(transcript);
        };
        recognition.onend = function () {
          isListening = false;
          if (currentState === 'listening') currentState = 'idle';
          actionBtn.classList.remove('listening');
        };
      }

      function toggleVoice() {
        if (recognition) {
          if (isListening) recognition.stop();
          else recognition.start();
        } else {
          cmdInput.focus();
        }
      }

      micBtn.addEventListener('click', toggleVoice);

      cmdForm.addEventListener('submit', function (e) {
        e.preventDefault();
        const val = cmdInput.value.trim();
        if (val || pendingAttachments.length > 0) {
          cmdInput.value = '';
          syncActionIcon();
          sendCommand(val);
        } else {
          toggleVoice();
        }
      });

      if (autoStart && recognition) {
        setTimeout(function () {
          try { recognition.start(); } catch (_) {}
        }, 350);
      }
    })();
  </script>
</body>
</html>
